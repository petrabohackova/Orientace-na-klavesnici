<!DOCTYPE html><html lang="cs"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Trenažér české klávesnice 2.0</title><style>body{font-family:Segoe UI,Arial,sans-serif;background:#eef4ff;padding:20px;text-align:center}.box{max-width:900px;margin:auto;background:#fff;padding:25px;border-radius:20px;box-shadow:0 0 15px rgba(0,0,0,.15)}#target{font-size:42px;font-weight:bold;min-height:80px;margin:25px;color:#0b4a86}input,select,button{padding:10px;font-size:18px;margin:5px}#answer{width:80%;font-size:26px;text-align:center}.result{font-size:22px;margin-top:20px}</style></head><body><div class="box"><h1>⌨️ Trenažér české klávesnice 2.0</h1><input id="playerName" placeholder="Jméno žáka"><br><select id="level"><option value="1">Velká písmena</option><option value="2">Malá písmena</option><option value="3">Krátká slova</option><option value="4">Náročná slova</option><option value="5">Věty</option><option value="6">Vlastní a zeměpisná jména</option><option value="7">Ň/ň speciál</option></select><select id="gameTime"><option value="30">30 s</option><option value="60" selected>60 s</option><option value="120">120 s</option></select><button onclick="startGame()">Spustit</button><p>⏱️ <span id="time">0</span></p><div id="target">Vyber level a spusť hru</div><input id="answer" disabled><p>✅ <span id="correct">0</span> | ❌ <span id="wrong">0</span></p><div id="result" class="result"></div></div><script>const data={1:['Á','Č','Ď','É','Ě','Í','Ň','Ó','Ř','Š','Ť','Ú','Ů','Ý','Ž'],2:['á','č','ď','é','ě','í','ň','ó','ř','š','ť','ú','ů','ý','ž'],3:['kůň','žába','říjen','náměstí','úkol','štěstí','želva','ředitel','čáp','měsíc','stůl','nůž','příběh','království','dítě','židle'],4:['Nejúspěšnější','Předjíždění','Železobetonový','Čtyřúhelníkový','Řeckořímský','Mimořádný','Zúčastněný','Vyúčtování','Mezinárodní'],5:['Žlutý kůň běžel přes náměstí.','Ředitel školy vyhlásil mimořádné volno.','Ája navštívila Žofii v Ústí nad Labem.','Nejúspěšnější žákyně převzala ocenění.','Při předjíždění musí být řidič opatrný.'],6:['Ázerbájdžán','České Budějovice','Žďár nad Sázavou','Ústí nad Labem','Řehoř','Žofie','Šárka','Švýcarsko'],7:['Ň','ň','Ňadro','ňadro','Kůň','Loňský','Splněný','Odůvodnění','Naplnění']};let current='',last='',correct=0,wrong=0,chars=0,timer,timeLeft=0;function pick(a){let x;do{x=a[Math.floor(Math.random()*a.length)]}while(x===last&&a.length>1);last=x;return x;}function nextItem(){current=pick(data[level.value]);target.textContent=current;answer.value='';answer.focus();}function startGame(){if(!playerName.value.trim()){alert('Zadejte jméno');return;}correct=wrong=chars=0;document.getElementById('correct').textContent=0;document.getElementById('wrong').textContent=0;result.innerHTML='';timeLeft=Number(gameTime.value);time.textContent=timeLeft;answer.disabled=false;nextItem();clearInterval(timer);timer=setInterval(()=>{timeLeft--;time.textContent=timeLeft;if(timeLeft<=0){clearInterval(timer);answer.disabled=true;const total=correct+wrong;const ok=total?Math.round(correct/total*100):0;const cpm=Math.round(chars/(Number(gameTime.value)/60));result.innerHTML='🏆 '+playerName.value+'<br>Správně: '+correct+'<br>Chyby: '+wrong+'<br>Úspěšnost: '+ok+' %<br>Znaků za minutu: '+cpm;}},1000);}answer.addEventListener('keydown',e=>{if(e.key==='Enter'&&!answer.disabled){if(answer.value.trim()===current){correct++;chars+=current.length;document.getElementById('correct').textContent=correct;}else{wrong++;document.getElementById('wrong').textContent=wrong;}nextItem();}});</script></body></html>
